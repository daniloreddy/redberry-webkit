<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — {{ app_name }}</title>
<link rel="stylesheet" href="/ui/_assets/app.css">
{% if has_favicon %}<link rel="icon" href="/ui/_assets/favicon">{% endif %}
{{ extra_head }}
<script>
(function () {
  var s = localStorage.getItem('dark_mode');
  var d = s === null ? true : s === 'true';
  document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
})();
</script>
