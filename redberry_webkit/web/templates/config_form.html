<div class="wk-form">
  {% if banner %}<p class="banner {{ 'ok' if banner_ok else 'err' }}">{{ banner }}</p>{% endif %}
  <form method="post" action="/ui/config">
    {% for f in fields %}
    <label>
      {% if f.type == "bool" %}
        <input type="checkbox" name="{{ f.key }}"{% if f.value == "true" %} checked{% endif %}> {{ f.label }}
      {% elif f.type == "select" %}
        {{ f.label }}
        <select name="{{ f.key }}">
          {% if f.value not in f.options %}<option value="" selected>{{ f.value ~ " (non in elenco)" if f.value else "(non impostato)" }}</option>{% endif %}
          {% for o in f.options %}<option value="{{ o }}"{% if o == f.value %} selected{% endif %}>{{ o }}</option>{% endfor %}
        </select>
      {% elif f.type == "textarea" %}
        {{ f.label }}
        <textarea name="{{ f.key }}" rows="6">{{ f.value }}</textarea>
      {% else %}
        {{ f.label }}
        <input type="{{ 'password' if f.password else ('number' if f.type == 'number' else 'text') }}"
               name="{{ f.key }}"
               {% if f.password %}placeholder="(invariata)" autocomplete="new-password"{% else %}value="{{ f.value }}"{% endif %}>
        {% if f.password %}<small><label style="display:inline"><input type="checkbox" name="{{ f.key }}__clear"> Rimuovi il valore attuale</label></small>{% endif %}
      {% endif %}
      {% if f.help %}<small>{{ f.help }}</small>{% endif %}
    </label>
    {% endfor %}
    <button type="submit">Salva</button>
  </form>
</div>
